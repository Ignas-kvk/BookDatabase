<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="text" id="name" placeholder="Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            console.log("Signup form submitted"); // Debugging log

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            console.log("Name:", name, "Email:", email, "Password:", password); // Debugging log

            try {
                const response = await fetch("http://localhost:3000/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                console.log("Response status:", response.status); // Debugging log
                const data = await response.json();
                console.log("Response data:", data); // Debugging log

                alert(data.message || data.error);

                if (data.message) {
                    console.log("Signup successful, redirecting to login.html"); // Debugging log
                    window.location.href = "login.html"; // Redirect to login page
                }
            } catch (error) {
                console.error("Error during signup:", error); // Debugging log
            }
        });
    </script>
</body>
</html>
